<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Outreach Cloud Bot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
        body { font-family: 'Outfit', sans-serif; background: #0f172a; color: white; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .btn-wa { background: #25D366; transition: 0.3s; }
        .btn-wa:hover { background: #128C7E; transform: translateY(-3px); }
        .btn-ig { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); transition: 0.3s; }
        .btn-ig:hover { filter: brightness(1.2); transform: translateY(-3px); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- HOME SCREEN -->
    <div id="home-screen" class="text-center">
        <h1 class="text-5xl font-extrabold mb-4 bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">
            Ultimate Cloud Bot
        </h1>
        <p class="text-slate-400 mb-12">Select the platform you want to automate today</p>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-4xl">
            <!-- WhatsApp Card -->
            <div onclick="showSection('whatsapp')" class="glass p-10 rounded-3xl cursor-pointer hover:bg-white/10 transition-all border-emerald-500/30 border-2">
                <div class="text-6xl mb-4">🟢</div>
                <h2 class="text-3xl font-bold mb-2">WhatsApp</h2>
                <p class="text-slate-400">Bulk send via QR scan</p>
            </div>
            
            <!-- Instagram Card -->
            <div onclick="showSection('instagram')" class="glass p-10 rounded-3xl cursor-pointer hover:bg-white/10 transition-all border-pink-500/30 border-2">
                <div class="text-6xl mb-4">🟣</div>
                <h2 class="text-3xl font-bold mb-2">Instagram</h2>
                <p class="text-slate-400">Direct DM via Login</p>
            </div>
        </div>
    </div>

    <!-- WHATSAPP SECTION -->
    <div id="wa-section" class="hidden w-full max-w-2xl">
        <button onclick="showSection('home')" class="mb-6 text-slate-400 hover:text-white">← Back to Home</button>
        <div class="glass p-8 rounded-3xl">
            <h2 class="text-3xl font-bold mb-6 text-emerald-400">WhatsApp Outreach</h2>
            
            <div id="wa-status" class="mb-6 p-4 rounded-xl bg-slate-800 text-center font-bold">Checking Status...</div>
            
            <div id="qr-container" class="flex justify-center mb-6 bg-white p-4 rounded-2xl hidden">
                <div id="qrcode"></div>
            </div>

            <div id="wa-form" class="space-y-4">
                <input type="file" id="wa-csv" class="w-full bg-slate-800 p-3 rounded-xl border border-slate-700">
                <textarea id="wa-template" placeholder="Hello {Doctor Name}! Saw you in {City}." class="w-full h-32 bg-slate-800 p-4 rounded-xl border border-slate-700"></textarea>
                <div class="flex gap-4">
                    <input type="number" id="wa-min" placeholder="Min Delay" value="30" class="w-1/2 bg-slate-800 p-3 rounded-xl">
                    <input type="number" id="wa-max" placeholder="Max Delay" value="60" class="w-1/2 bg-slate-800 p-3 rounded-xl">
                </div>
                <button onclick="startSending('whatsapp')" class="w-full btn-wa py-4 rounded-xl font-bold text-xl shadow-lg shadow-emerald-500/20">🚀 Start WhatsApp Campaign</button>
            </div>
        </div>
    </div>

    <!-- INSTAGRAM SECTION -->
    <div id="ig-section" class="hidden w-full max-w-2xl">
        <button onclick="showSection('home')" class="mb-6 text-slate-400 hover:text-white">← Back to Home</button>
        <div class="glass p-8 rounded-3xl">
            <h2 class="text-3xl font-bold mb-6 text-pink-400">Instagram Outreach</h2>
            
            <div id="ig-status" class="mb-6 p-4 rounded-xl bg-slate-800 text-center font-bold">Not Logged In</div>

            <div id="ig-login-form" class="space-y-4 mb-8 p-6 bg-slate-800/50 rounded-2xl">
                <input type="text" id="ig-user" placeholder="Instagram Username" class="w-full bg-slate-800 p-3 rounded-xl">
                <input type="password" id="ig-pass" placeholder="Password" class="w-full bg-slate-800 p-3 rounded-xl">
                <button onclick="igLogin()" class="w-full bg-slate-600 hover:bg-slate-500 py-3 rounded-xl font-bold">Login to Instagram</button>
            </div>

            <div class="space-y-4">
                <input type="file" id="ig-csv" class="w-full bg-slate-800 p-3 rounded-xl">
                <textarea id="ig-template" placeholder="Hi {Doctor Name}!" class="w-full h-32 bg-slate-800 p-4 rounded-xl border border-slate-700"></textarea>
                <div class="flex gap-4">
                    <input type="number" id="ig-min" placeholder="Min Delay" value="300" class="w-1/2 bg-slate-800 p-3 rounded-xl">
                    <input type="number" id="ig-max" placeholder="Max Delay" value="600" class="w-1/2 bg-slate-800 p-3 rounded-xl">
                </div>
                <button onclick="startSending('instagram')" class="w-full btn-ig py-4 rounded-xl font-bold text-xl shadow-lg shadow-pink-500/20">🚀 Start Instagram Campaign</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        function showSection(id) {
            ['home-screen', 'wa-section', 'ig-section'].forEach(s => document.getElementById(s).classList.add('hidden'));
            document.getElementById(id + '-section').classList.remove('hidden');
        }

        async function updateWAStatus() {
            const res = await fetch('/api/wa/status');
            const data = await res.json();
            document.getElementById('wa-status').innerText = data.status;
            const qrDiv = document.getElementById('qr-container');
            if (data.qr) {
                qrDiv.classList.remove('hidden');
                document.getElementById('qrcode').innerHTML = '';
                new QRCode(document.getElementById('qrcode'), data.qr);
            } else {
                qrDiv.classList.add('hidden');
            }
        }

        async function igLogin() {
            const user = document.getElementById('ig-user').value;
            const pass = document.getElementById('ig-pass').value;
            const res = await fetch('/api/ig/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: user, password: pass})
            });
            const data = await res.json();
            if (data.success) {
                document.getElementById('ig-status').innerText = 'Logged in as ' + user;
                alert('Instagram Login Successful!');
            } else {
                alert('Login Failed: ' + data.error);
            }
        }

        async function startSending(platform) {
            const csvFile = document.getElementById(platform + '-csv').files[0];
            const template = document.getElementById(platform + '-template').value;
            const minDelay = document.getElementById(platform + '-min').value;
            const maxDelay = document.getElementById(platform + '-max').value;

            if (!csvFile) return alert('Please select CSV file!');

            const formData = new FormData();
            formData.append('csv', csvFile);
            formData.append('platform', platform);
            formData.append('template', template);
            formData.append('minDelay', minDelay);
            formData.append('maxDelay', maxDelay);

            const res = await fetch('/api/send', { method: 'POST', body: formData });
            const data = await res.json();
            alert(data.message);
        }

        setInterval(updateWAStatus, 5000);
        updateWAStatus();
    </script>
</body>
</html>
