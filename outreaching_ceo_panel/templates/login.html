<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEO Access | Outreaching Panel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="login-card glass animate-fade">
        <div class="login-header">
            <div class="logo">CEO PANEL</div>
            <p style="color: var(--text-secondary); margin-top: 10px;">Enter credentials to manage bot fleet</p>
        </div>
        
        <form method="POST">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="ceo_username" required>
            </div>
            <div class="form-group">
                <label>Master Password</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div style="color: var(--danger); margin-bottom: 15px; font-size: 14px; text-align: center;">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">AUTHORIZE ACCESS</button>
        </form>
    </div>
</body>
</html>
